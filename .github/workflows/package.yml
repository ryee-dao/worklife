name: Package

# A required check on main: the installers must build on every OS, carry the expected signature, and start
on:
  pull_request:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/package
